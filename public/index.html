<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BandageJS</title>
    <meta
      name="description"
      content="Draw a GFA pangenome or assembly graph in the browser: Bandage's force-directed layout compiled to wasm, plus reference-anchored layouts, bubbles and haplotype walks."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 22 C10 6 14 6 16 16 S24 28 28 10' fill='none' stroke='%232f6fd6' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header>
      <div class="brand">
        <h1>BandageJS</h1>
        <a
          class="about"
          href="https://github.com/cmdcolin/BandageJS"
          title="The graph viewer from jbrowse-plugin-graphgenomeviewer, as a page of its own"
          >source</a
        >
      </div>
      <div class="group">
        <label class="button">
          Open GFA…
          <input
            id="file"
            type="file"
            accept=".gfa,.rgfa,.txt,text/plain"
            hidden
          />
        </label>
        <form id="url-form">
          <input
            id="url"
            type="url"
            placeholder="or a GFA url"
            aria-label="GFA url"
          />
        </form>
        <select id="example" aria-label="Example graph"></select>
      </div>
      <div class="group">
        <select id="layout" aria-label="Layout"></select>
        <select id="color" aria-label="Colour"></select>
        <select id="node-width" aria-label="Node width"></select>
        <select id="quality" aria-label="Layout quality"></select>
        <select id="spread" aria-label="Bubble spread"></select>
      </div>
      <div class="group">
        <select id="walk" aria-label="Lift a walk"></select>
        <label hidden
          >Reference
          <select id="reference"></select
        ></label>
        <label><input id="bubbles" type="checkbox" /> Bubbles</label>
        <label><input id="deletions" type="checkbox" /> Deletion edges</label>
        <label><input id="paths" type="checkbox" /> Path colours</label>
        <button id="fit" type="button">Fit</button>
      </div>
      <span id="stats"></span>
    </header>
    <main id="pane">
      <canvas id="graph"></canvas>
      <svg id="overlay-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="overlay-html"></div>
      <div id="legends"></div>
      <button id="back" type="button" hidden></button>
      <div id="tooltip" hidden></div>
      <div id="status" hidden></div>
      <div id="empty">
        <p>Drop a GFA file here, open one, or pick an example.</p>
      </div>
    </main>
  </body>
</html>
