<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BandageJS</title>
    <meta
      name="description"
      content="Draw a GFA pangenome or assembly graph in the browser: Bandage's force-directed layout compiled to wasm, plus reference-anchored layouts, bubbles and haplotype walks."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 22 C10 6 14 6 16 16 S24 28 28 10' fill='none' stroke='%232f6fd6' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <header class="appbar">
      <span class="brand">BandageJS</span>
      <nav id="menus" aria-label="Menus"></nav>
      <span id="stats"></span>
      <a class="source" href="https://github.com/cmdcolin/BandageJS">GitHub</a>
    </header>
    <input id="file" type="file" accept=".gfa,.rgfa,.txt,text/plain" hidden />
    <main id="pane">
      <canvas id="graph"></canvas>
      <svg id="overlay-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      <div id="overlay-html"></div>
      <div id="legends"></div>
      <button id="back" type="button" hidden></button>
      <div id="tooltip" hidden></div>
      <div id="status" hidden></div>
      <div id="empty">
        <p>Drop a GFA file here, or open one from the File menu.</p>
      </div>
    </main>

    <dialog id="url-dialog">
      <form method="dialog">
        <h2>Open GFA url</h2>
        <label>
          Url
          <input id="url" type="url" placeholder="https://…/graph.gfa" />
        </label>
        <p class="hint">The server has to allow cross-origin reads.</p>
        <menu>
          <button value="cancel" formnovalidate>Cancel</button>
          <button value="open" class="primary">Open</button>
        </menu>
      </form>
    </dialog>

    <dialog id="gbz-dialog">
      <form method="dialog">
        <h2>Open pangenome database</h2>
        <p class="hint">
          A <code>.gbz.db</code> from gbz-base, read by range requests. The
          defaults are the HPRC release 2 graph.
        </p>
        <label>Database <input id="gbz-db" type="url" /></label>
        <label>
          Haplotype index (optional)
          <input id="gbz-index" type="url" />
        </label>
        <label>
          Region on the reference
          <input id="gbz-region" placeholder="chr6:160,614,798-160,647,758" />
        </label>
        <label>
          Haplotypes (comma separated; empty is every one)
          <input id="gbz-haplotypes" placeholder="HG00097,HG00133" />
        </label>
        <menu>
          <button value="cancel" formnovalidate>Cancel</button>
          <button value="open" class="primary">Cut</button>
        </menu>
      </form>
    </dialog>
  </body>
</html>
